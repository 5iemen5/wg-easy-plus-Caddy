services:
  wg-easy:
    container_name: wg-easy
    environment:

      - WG_HOST=YOUR_DOMAIN_OR_IP

      # This is the exact pre-generated hash for the word: password
      - PASSWORD_HASH=$$2a$$14$$VIJZ6SsZKJBkEy2VR7WPdesQPQGm0j6.jg1vQzbzo1FglcNF7l8X.
      
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_MTU=1420

      #FOR CADDY 1
      - PORT=80
    image: ghcr.io/wg-easy/wg-easy

    volumes:
      - ./.wg-easy_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      #- "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      #FOR CADDY 2
    networks:
      - caddy
    
      #FOR CADDY 3
networks:
  caddy:
    external: true
